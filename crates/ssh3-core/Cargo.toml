[package]
name = "ssh3-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "ssh3-rs protocol core: QUIC transport, auth handshake, resumable channels"

[dependencies]
bytes = "1"
libc = "0.2"
postcard = { version = "1", features = ["alloc"] }
quinn = "0.11.12"
quinn-proto = "=0.11.19"
rand = "0.8"
ring = "0.17"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "logging", "tls12"] }
serde = { version = "1", features = ["derive"] }
ssh-key = { version = "0.6.7", default-features = false, features = ["std"] }
ssh3-keys = { path = "../ssh3-keys" }
ssh3-session = { path = "../ssh3-session" }
ssh3-term = { path = "../ssh3-term" }
socket2 = "0.6"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"

[dev-dependencies]
ssh-key = { version = "0.6.7", features = ["ed25519"] }
sha2 = "0.10"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
