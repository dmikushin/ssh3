[package]
name = "ssh3-keys"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Host identity, known_hosts, signing (file/agent), auth blob and authorized_keys for ssh3-rs"

[dependencies]
base64 = "0.22"
ed25519-dalek = { version = "2", features = ["pkcs8"] }
getrandom = "0.2"
hmac = "0.12"
p256 = { version = "0.13", features = ["pkcs8", "ecdsa"] }
p384 = { version = "0.13", features = ["pkcs8", "ecdsa"] }
pkcs8 = { version = "0.10", features = ["alloc"] }
rcgen = "0.14.10"
rsa = "0.9.10"
rustls = { version = "0.23.46", default-features = false, features = ["logging", "ring", "std"] }
sha1 = "0.10"
signature = "2"
sha2 = { version = "0.10", features = ["oid"] }
ssh-encoding = { version = "0.2", features = ["std"] }
ssh-key = { version = "0.6.7", features = ["ed25519", "ecdsa", "p256", "p384", "rsa", "std", "encryption"] }
thiserror = "2.0.21"
x509-parser = "0.18.1"

[dev-dependencies]
tempfile = "3.27.0"
