[package]
name = "ssh3-path"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "ssh3-rs path layer below quinn: path socket, direct-path upgrade (NAT traversal), relay fallback, NAT simulator"

[dependencies]
arc-swap = "1"
bytes = "1"
libc = "0.2"
quinn = "0.11.12"
ring = "0.17"
tokio = { version = "1", features = ["rt", "sync", "time", "macros"] }
tracing = "0.1"

[dev-dependencies]
rcgen = "0.14"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "logging", "tls12"] }
tokio = { version = "1", features = ["full"] }
